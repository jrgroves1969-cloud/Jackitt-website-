name: Optimize CRAWLER image

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/optimize-crawler-image.yml"
      - "JACKITT_CRAWLER_ORIGINAL_FINAL_JACK.png"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install WebP tools
        run: |
          sudo apt-get update
          sudo apt-get install -y webp

      - name: Build responsive WebP copies
        run: |
          cwebp -quiet -q 92 -m 6 -resize 1100 0 JACKITT_CRAWLER_ORIGINAL_FINAL_JACK.png -o JACKITT_CRAWLER_ORIGINAL_FINAL_JACK_1100.webp
          cwebp -quiet -q 90 -m 6 -resize 720 0 JACKITT_CRAWLER_ORIGINAL_FINAL_JACK.png -o JACKITT_CRAWLER_ORIGINAL_FINAL_JACK_720.webp

      - name: Commit optimized images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add JACKITT_CRAWLER_ORIGINAL_FINAL_JACK_1100.webp JACKITT_CRAWLER_ORIGINAL_FINAL_JACK_720.webp
          if ! git diff --cached --quiet; then
            git commit -m "Add optimized CRAWLER web images"
            git push
          fi
